        - 'asdfghjkl'
        - 'zxcvbnm123'
        - 'password!'
        - 'admin123!'
        - 'root1234'
        - 'test@123'
  - id: WS-015
    name: 默认管理员凭据
    severity: high
    description: 配置出现 admin:admin、root:root 等默认口令组合。
    remediation: 删除默认凭据并强制首次登录修改口令。
    match:
      type: regex
      pattern: >-
        (?i)\b(?:admin|root)\s*[:=]\s*["']?(?:admin|root|123456|password)\b
  - id: WS-016
    name: PostgreSQL 信任认证
    severity: high
    description: 主机认证规则对任意地址使用 trust，数据库将不校验口令。
    remediation: 改用 scram-sha-256 并限制来源地址。
    match:
      type: regex
      pattern: >-
        (?i)\bhost\s+all\s+all\s+0\.0\.0\.0/0\s+trust\b
  - id: WS-017
    name: Elasticsearch 安全功能关闭
    severity: high
    description: xpack 安全功能被关闭，集群可能允许未认证访问。
    remediation: 开启 xpack.security.enabled 并配置 TLS 与认证。
    match:
      type: regex
      pattern: >-
        (?i)\bxpack\.security\.enabled["\']?\s*[:=]\s*["']?(?:false|0|off|no)\b
  - id: WS-018
    name: Redis 保护模式关闭
    severity: high
    description: Redis protected-mode 被关闭，未授权网络访问风险升高。
    remediation: 开启保护模式，同时设置强口令并限制监听地址。
    match:
      type: regex
      pattern: >-
        (?i)\bprotected-mode\b\s*[:=]?\s*["']?(?:no|false|off|0)\b
  - id: WS-019
    name: SSH 允许 root 口令登录
    severity: high
    description: SSH 允许 root 登录或口令认证，增加被暴力破解的风险。
    remediation: 设置 PermitRootLogin no，并优先使用密钥认证。
    match:
      type: regex
      pattern: >-
        (?i)\b(?:PermitRootLogin|PasswordAuthentication)\b\s*[:=\s]\s*(?:yes|true|on)\b
  - id: WS-020
    name: MySQL 跳过权限表启动
    severity: high
    description: 配置启用 skip-grant-tables，任何用户都可绕过数据库认证。
    remediation: 删除该参数，并通过正规流程恢复账号权限。
    match:
      type: regex
      pattern: >-
        (?i)\bskip-grant-tables\b
