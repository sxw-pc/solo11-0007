category: hardcoded_credential
version: 1
rules:
  - id: HC-001
    name: 明文密码赋值
    severity: high
    description: 配置中存在直接写入的明文密码，读取配置的人员可直接获得凭据。
    remediation: 移除明文密码，改由环境变量或本地密钥管理系统注入。
    match:
      type: regex
      pattern: >-
        (?i)(?:^|[\s,{])["']?[\w.-]*(?:password|passwd|pwd)["']?\s*[:=]\s*["']?([^"'\s#]{4,})
      capture_group: 1
  - id: HC-002
    name: API 密钥或客户端密钥明文
    severity: high
    description: 配置中写入了 API Key、Access Key 或客户端密钥明文。
    remediation: 立即轮换该密钥，并改为运行时安全注入。
    match:
      type: regex
      pattern: >-
        (?i)(?:^|[\s,{])["']?[\w.-]*(?:api[_-]?key|access[_-]?key(?:[_-](?:id|secret))?|secret[_-]?key|secret[_-]?access[_-]?key|client[_-]?secret|app[_-]?secret)["']?\s*[:=]\s*["']?([A-Za-z0-9_./+=-]{8,})
      capture_group: 1
  - id: HC-003
    name: AWS 访问密钥特征
    severity: high
    description: 发现符合 AWS Access Key ID 特征的字符串，可能是硬编码云凭据。
    remediation: 禁用该访问密钥并改用临时角色凭据。
    match:
      type: regex
      pattern: >-
        \b(?:AKIA|ASIA|AIDA|AROA)[A-Z0-9]{16}\b
  - id: HC-004
    name: 私钥文件头
    severity: high
    description: 配置中嵌入了 PEM 私钥内容，私钥可能被未授权复制。
    remediation: 从配置中删除私钥，改用受保护的密钥文件并限制读取权限。
    match:
      type: regex
      pattern: >-
        -----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----
  - id: HC-005
    name: JWT 令牌明文
    severity: high
    description: 配置中直接保存了可用的 JWT 令牌。
    remediation: 将令牌移至安全的短期凭据存储，并及时使其失效。
    match:
      type: regex
      pattern: >-
        \beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b
  - id: HC-006
    name: 数据库连接串含明文口令
    severity: high
    description: 数据库连接 URL 中包含明文用户名与口令。
    remediation: 从连接串移除口令，使用环境变量或连接池密钥引用。
    match:
      type: regex
      pattern: >-
        (?i)\b(?:mysql|postgres(?:ql)?|mongodb|redis|amqp)://[^:\s/]+:([^@\s/]{3,})@
      capture_group: 1
  - id: HC-007
    name: Bearer 令牌
    severity: high
    description: Authorization 配置中出现 Bearer 令牌明文。
    remediation: 立即吊销该令牌并改由运行时安全注入。
    match:
      type: regex
      pattern: >-
        (?i)\bAuthorization\s*[:=]\s*Bearer\s+([A-Za-z0-9._~+/-]{12,}=*)
      capture_group: 1
  - id: HC-008
    name: Redis 访问口令明文
    severity: high
    description: Redis 配置中出现 requirepass 明文口令。
    remediation: 轮换 Redis 口令并通过受控配置注入。
    match:
      type: regex
      pattern: >-
        (?i)^\s*requirepass\s*[:=\s]\s*([^\s#]{4,})
      capture_group: 1
  - id: HC-009
    name: 邮件服务口令明文
    severity: high
    description: SMTP 或邮件账号口令以明文形式保存在配置中。
    remediation: 使用应用专用凭据或环境变量，避免保存邮箱主口令。
    match:
      type: regex
      pattern: >-
        (?i)\b(?:smtp[_-]?password|mail[_-]?password|email[_-]?password)\s*[:=]\s*["']?([^"'\s#]{4,})
      capture_group: 1
  - id: HC-010
    name: 访问令牌赋值
    severity: medium
    description: 配置中直接赋值了较长的访问令牌。
    remediation: 将令牌放入离线密钥存储，避免进入版本库。
    match:
      type: regex
      pattern: >-
        (?i)(?:^|[\s,{])["']?[\w.-]*token["']?\s*[:=]\s*["']?([A-Za-z0-9._~+/=-]{12,})
      capture_group: 1
  - id: HC-011
    name: 阿里云 AccessKey 特征
    severity: high
    description: 发现符合阿里云 AccessKey ID 特征的字符串。
    remediation: 轮换 AccessKey，并改用最小权限的临时凭据。
    match:
      type: regex
      pattern: >-
        \bLTAI[0-9A-Za-z]{12,20}\b
  - id: HC-012
    name: 加密或签名密钥明文
    severity: high
    description: 加密密钥、AES 密钥或 HMAC 签名密钥以明文保存。
    remediation: 将密钥移出配置，使用操作系统密钥环或受限权限文件。
    match:
      type: regex
      pattern: >-
        (?i)\b(?:encryption[_-]?key|aes[_-]?key|hmac[_-]?secret|signing[_-]?key)\s*[:=]\s*["']?([A-Za-z0-9_./+=-]{8,})
      capture_group: 1
  - id: HC-013
    name: SSH 私钥口令明文
    severity: high
    description: SSH 私钥口令或跳板机口令直接写入配置文件。
    remediation: 使用 SSH Agent 或受保护的密钥存储，不保存明文口令。
    match:
      type: regex
      pattern: >-
        (?i)\b(?:(?:ssh|key)[_-]?passphrase|jump[_-]?password|passphrase)\s*[:=]\s*["']?([^"'\s#]{4,})
      capture_group: 1
  - id: HC-014
    name: 常见平台令牌特征
    severity: high
    description: 发现 Slack 或 GitHub 风格的平台访问令牌明文。
    remediation: 吊销令牌并改为短期、最小权限的凭据。
    match:
      type: regex
      pattern: >-
        \b(?:xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,})\b
